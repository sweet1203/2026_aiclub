<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 코딩 도우미</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.15);
      --text: #e8eaf6;
      --muted: #8892b0;
      --accent: #7c6af7;
      --accent2: #5eead4;
      --user-bubble: #1e2a4a;
      --ai-bubble: #1a2235;
      --code-bg: #0d1117;
      --radius: 14px;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 로그인 화면 ─────────────────────── */
    #loginScreen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      animation: fadeIn .4s ease;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 24px;
      padding: 48px 40px;
      width: min(420px, 90vw);
      text-align: center;
    }
    .login-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 20px;
      margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    .login-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .login-sub   { font-size: 14px; color: var(--muted); margin-bottom: 32px; }
    .login-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 2px;
      text-align: center;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 12px;
    }
    .login-input:focus { border-color: var(--accent); }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .login-btn:hover  { opacity: .9; }
    .login-btn:active { transform: scale(.98); }
    .login-error {
      font-size: 13px; color: #f87171;
      margin-top: 10px; min-height: 18px;
    }

    /* ── 헤더 ────────────────────────────── */
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
      background: var(--surface);
      flex-shrink: 0;
    }
    .header-logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .header-info h1 { font-size: 16px; font-weight: 700; }
    .header-info p  { font-size: 12px; color: var(--muted); }
    .status-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      margin-left: auto;
      flex-shrink: 0;
      box-shadow: 0 0 6px #4ade80;
      animation: pulse 2s infinite;
    }

    /* ── 채팅 영역 ───────────────────────── */
    #chatArea {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }
    #chatArea::-webkit-scrollbar { width: 4px; }
    #chatArea::-webkit-scrollbar-track { background: transparent; }
    #chatArea::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .msg { display: flex; gap: 10px; max-width: 85%; animation: msgIn .3s ease; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.ai   { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; margin-top: 2px;
    }
    .msg.user .avatar { background: var(--user-bubble); }
    .msg.ai   .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px; line-height: 1.7;
      max-width: 100%;
    }
    .msg.user .bubble {
      background: var(--user-bubble);
      border: 1px solid rgba(124,106,247,.3);
      border-top-right-radius: 4px;
    }
    .msg.ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    /* 코드 블록 */
    .bubble pre {
      background: var(--code-bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 12px 14px;
      margin: 10px 0;
      overflow-x: auto;
    }
    .bubble code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #a8d8a8;
    }
    .bubble p  { margin-bottom: 6px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { color: var(--accent2); }

    /* 빠른 질문 칩 */
    .quick-chips {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 0 20px 12px;
      flex-shrink: 0;
    }
    .chip {
      padding: 7px 14px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 20px;
      font-size: 12px; color: var(--muted);
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }
    .chip:hover { border-color: var(--accent); color: var(--text); }

    /* ── 입력창 ──────────────────────────── */
    .input-wrap {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .input-row {
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 10px 10px 10px 16px;
      transition: border-color .2s;
    }
    .input-row:focus-within { border-color: var(--accent); }
    #userInput {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      resize: none; line-height: 1.5;
      max-height: 120px;
    }
    #userInput::placeholder { color: var(--muted); }
    #sendBtn {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--accent); border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: opacity .2s, transform .1s;
    }
    #sendBtn:hover  { opacity: .85; }
    #sendBtn:active { transform: scale(.95); }
    #sendBtn:disabled { opacity: .35; cursor: not-allowed; }
    #sendBtn svg { width: 16px; height: 16px; fill: white; }

    /* 타이핑 인디케이터 */
    .typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing span {
      width: 6px; height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce .9s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }

    /* 환영 메시지 */
    .welcome {
      text-align: center; padding: 40px 20px;
      color: var(--muted); font-size: 14px; line-height: 2;
    }
    .welcome h2 { font-size: 20px; color: var(--text); margin-bottom: 8px; }

    @keyframes fadeIn  { from { opacity: 0 } to { opacity: 1 } }
    @keyframes msgIn   { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    @keyframes bounce  { 0%,80%,100% { transform: translateY(0) } 40% { transform: translateY(-6px) } }
    @keyframes pulse   { 0%,100% { opacity: 1 } 50% { opacity: .4 } }
  </style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">🤖</div>
    <div class="login-title">AI 코딩 도우미</div>
    <div class="login-sub">동아리 전용 · 비밀번호를 입력하세요</div>
    <input type="password" id="pwInput" class="login-input" placeholder="비밀번호" />
    <button class="login-btn" onclick="tryLogin()">입장하기</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- 메인 앱 -->
<header>
  <div class="header-logo">🤖</div>
  <div class="header-info">
    <h1>AI 코딩 도우미</h1>
    <p>웹앱 개발 전문 AI · 코드 작성 · 에러 해결 · 아이디어 제안</p>
  </div>
  <div class="status-dot"></div>
</header>

<div id="chatArea">
  <div class="welcome">
    <h2>안녕하세요! 👋</h2>
    코드 작성, 에러 해결, 아이디어 구현까지<br>
    무엇이든 물어보세요!
  </div>
</div>

<div class="quick-chips" id="quickChips">
  <div class="chip" onclick="quickSend('HTML 버튼 클릭하면 글자색 바꾸는 방법 알려줘')">🎨 버튼으로 색상 변경</div>
  <div class="chip" onclick="quickSend('JavaScript에서 에러가 났어. 어떻게 디버깅해?')">🐛 에러 디버깅 방법</div>
  <div class="chip" onclick="quickSend('CSS로 카드 레이아웃 예쁘게 만드는 방법 알려줘')">🃏 카드 레이아웃</div>
  <div class="chip" onclick="quickSend('웹앱 아이디어 추천해줘')">💡 아이디어 추천</div>
  <div class="chip" onclick="quickSend('API 연동하는 방법 쉽게 설명해줘')">🔌 API 연동</div>
</div>

<div class="input-wrap">
  <div class="input-row">
    <textarea id="userInput" rows="1" placeholder="질문을 입력하세요... (Shift+Enter 줄바꿈, Enter 전송)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  // ── 설정 ─────────────────────────────────────────────
  const ACCESS_PASSWORD = 'coding2025';   // ← 비밀번호 여기서 변경!
  const SESSION_KEY = 'ai_helper_auth';

  // ── 로그인 ───────────────────────────────────────────
  function tryLogin() {
    const pw = document.getElementById('pwInput').value;
    if (pw === ACCESS_PASSWORD) {
      sessionStorage.setItem(SESSION_KEY, 'ok');
      document.getElementById('loginScreen').style.display = 'none';
    } else {
      document.getElementById('loginError').textContent = '비밀번호가 틀렸어요. 다시 확인해 보세요!';
      document.getElementById('pwInput').focus();
    }
  }
  document.getElementById('pwInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
  });
  if (sessionStorage.getItem(SESSION_KEY) === 'ok') {
    document.getElementById('loginScreen').style.display = 'none';
  }

  // ── 대화 기록 ────────────────────────────────────────
  let history = [];

  // ── 메시지 렌더링 ─────────────────────────────────────
  function appendMsg(role, text) {
    const chatArea = document.getElementById('chatArea');
    const welcome = chatArea.querySelector('.welcome');
    if (welcome) welcome.remove();

    const msgEl = document.createElement('div');
    msgEl.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👩' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatText(text);

    msgEl.appendChild(avatar);
    msgEl.appendChild(bubble);
    chatArea.appendChild(msgEl);
    chatArea.scrollTop = chatArea.scrollHeight;
    return bubble;
  }

  function formatText(text) {
    // 코드 블록
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${escHtml(code.trim())}</code></pre>`);
    // 인라인 코드
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    // 굵게
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // 줄바꿈
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── 타이핑 표시 ──────────────────────────────────────
  function showTyping() {
    const chatArea = document.getElementById('chatArea');
    const el = document.createElement('div');
    el.className = 'msg ai'; el.id = 'typingIndicator';
    el.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chatArea.appendChild(el);
    chatArea.scrollTop = chatArea.scrollHeight;
  }
  function hideTyping() {
    document.getElementById('typingIndicator')?.remove();
  }

  // ── 전송 ─────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('quickChips').style.display = 'none';

    appendMsg('user', text);
    history.push({ role: 'user', content: text });

    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      hideTyping();

      const reply = data.reply || '오류가 발생했어요. 다시 시도해 주세요.';
      appendMsg('ai', reply);
      history.push({ role: 'assistant', content: reply });
    } catch {
      hideTyping();
      appendMsg('ai', '서버에 연결할 수 없어요. 잠시 후 다시 시도해 주세요.');
    }

    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  function quickSend(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
  }

  // ── 자동 높이 조절 ────────────────────────────────────
  const userInput = document.getElementById('userInput');
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });
  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
</script>
</body>
</html>
